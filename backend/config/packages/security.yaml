security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Identity\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Identity\Security\UserChecker
            entry_point: App\Identity\Security\JsonSecurityHandler

            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: App\Identity\Security\JsonSecurityHandler
                failure_handler: App\Identity\Security\JsonSecurityHandler

            # Contro il tentativo di indovinare le password (non c'era nel legacy: correzione di sicurezza).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: api_auth_logout
                # Il logout è un POST: non c'è una pagina a cui tornare.

            access_denied_handler: App\Identity\Security\JsonSecurityHandler

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/(login|register|google)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/me$, roles: IS_AUTHENTICATED_FULLY }
        # Adesione diretta senza pagamento: disabilitata (410) per chiunque, anche ospiti.
        - { path: ^/api/campaigns/[^/]+/join$, roles: PUBLIC_ACCESS }
        # Chiusura, annullamento e invio al fornitore: solo admin.
        - { path: ^/api/campaigns/[^/]+/(close|cancel|send-to-supplier)$, methods: [POST], roles: ROLE_ADMIN }
        # Elenco e dettaglio dei gruppi sono pubblici (GET); creare, modificare ed eliminare è solo dell'admin.
        - { path: ^/api/campaigns(/[^/]+)?$, methods: [POST, PATCH, PUT, DELETE], roles: ROLE_ADMIN }
        # Webhook di Stripe: nessun login, la richiesta è autenticata dalla firma (Stripe-Signature).
        - { path: ^/api/stripe/webhook$, roles: PUBLIC_ACCESS }
        # Pagamenti: serve un utente collegato (l'account sospeso è già bloccato dal UserChecker).
        - { path: ^/api/payments, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                login_throttling:
                    max_attempts: 1000
