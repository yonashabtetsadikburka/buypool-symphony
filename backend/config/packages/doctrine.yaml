doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: false
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'App\Identity\Entity'
                alias: Identity
            Supplier:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Supplier/Entity'
                prefix: 'App\Supplier\Entity'
                alias: Supplier
            Campaign:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Campaign/Entity'
                prefix: 'App\Campaign\Entity'
                alias: Campaign
            Participation:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Participation/Entity'
                prefix: 'App\Participation\Entity'
                alias: Participation
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Payment/Entity'
                prefix: 'App\Payment\Entity'
                alias: Payment
            Delivery:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Delivery/Entity'
                prefix: 'App\Delivery\Entity'
                alias: Delivery
            Proposal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Proposal/Entity'
                prefix: 'App\Proposal\Entity'
                alias: Proposal
            Notification:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Notification/Entity'
                prefix: 'App\Notification\Entity'
                alias: Notification
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
