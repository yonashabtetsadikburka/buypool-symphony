name: CI

on:
  push:
    branches: [main]
  pull_request: ~

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: buypool
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      APP_SECRET: test-secret-not-used-in-production
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/buypool?serverVersion=8.0&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: http://localhost:8000
      MAILER_DSN: null://null
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, intl, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Static analysis
        run: composer stan

      - name: Tests
        run: composer test
