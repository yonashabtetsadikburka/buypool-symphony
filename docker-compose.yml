name: buypool-symphony

# Local development stack. All credentials below are examples, never production secrets.
services:
  php:
    build:
      context: ./infra/docker/php
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:80"
    environment:
      APP_ENV: dev
      APP_SECRET: changeme-set-a-real-secret-via-environment
      DATABASE_URL: "mysql://root:change-me@mysql:3306/app?serverVersion=8.0&charset=utf8mb4"
      CORS_ALLOW_ORIGIN: http://localhost:8000
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: change-me
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
